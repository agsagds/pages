<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приемы мистификации</title>
<style>
  :root{
    --ink:#141414;
    --ink-soft:#3d3d3d;
    --muted:#8b8b8b;
    --faint:#b4b4b4;
    --line:#ececec;
    --line-soft:#f3f3f3;
    --hover:#fafafa;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#fff;color:var(--ink);
    font-family:var(--sans);font-size:15px;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  #app{display:flex;min-height:100vh}

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:340px;flex:0 0 340px;
    border-right:1px solid var(--line);
    height:100vh;position:sticky;top:0;
    overflow-y:auto;padding:44px 0 60px 0;
    background:#fff;
  }
  #sidebar::-webkit-scrollbar{width:6px}
  #sidebar::-webkit-scrollbar-thumb{background:#e4e4e4;border-radius:3px}

  .side-head{padding:0 28px 24px 28px;border-bottom:1px solid var(--line-soft)}
  .side-title{
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-weight:500;cursor:pointer;transition:color .18s;
  }
  .side-title:hover{color:var(--ink)}

  .tree{padding:16px 12px 0 12px}
  .t-row{display:flex;align-items:flex-start;gap:2px}
  .twist{
    background:none;border:0;cursor:pointer;flex:0 0 18px;height:22px;
    color:var(--faint);font-size:9px;line-height:22px;padding:0;
    transition:transform .2s,color .16s;font-family:var(--sans);
  }
  .twist:hover{color:var(--ink)}
  .twist.open{transform:rotate(90deg)}
  .twist.leaf{visibility:hidden}
  .t-label{
    flex:1;background:none;border:0;text-align:left;cursor:pointer;
    font-family:var(--sans);font-size:13.5px;line-height:1.45;
    color:var(--ink-soft);padding:3px 8px 3px 0;border-radius:4px;transition:color .16s;
  }
  .t-label:hover{color:var(--ink)}
  .t-label.on{color:var(--ink);font-weight:600}
  .t-label .num{color:var(--faint);font-weight:400;margin-right:6px}
  .t-kids{margin-left:17px;border-left:1px solid var(--line-soft);padding-left:8px}
  .t-kids.collapsed{display:none}

  /* ---------- MAIN ---------- */
  #main{flex:1;min-width:0;display:flex;flex-direction:column}
  #mainBody{flex:1;padding:56px 72px 80px 72px}
  .wrap{max-width:780px;margin:0 auto}

  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:38px;font-size:12.5px;color:var(--faint)}
  .crumbs button{
    background:none;border:0;cursor:pointer;font-family:var(--sans);
    font-size:12.5px;color:var(--muted);padding:0;transition:color .16s;
  }
  .crumbs button:hover{color:var(--ink)}
  .crumbs .sep{color:#ddd}

  h1.term{
    font-family:var(--sans);font-size:31px;font-weight:500;
    letter-spacing:-.015em;line-height:1.28;color:var(--ink);
    display:inline-block;padding-bottom:3px;
    border-bottom:1px solid transparent;transition:border-color .2s;
  }
  h1.term.expandable{cursor:pointer}
  h1.term.expandable:hover{border-bottom-color:#d8d8d8}
  h1.term .num{color:var(--faint);font-weight:400;margin-right:12px}
  h1.term.opened{border-bottom-color:#e4e4e4}

  .def{
    margin-top:30px;font-family:var(--serif);font-size:17px;line-height:1.78;color:var(--ink-soft);
  }

  .qwrap{margin-top:32px}
  .qbody{border-left:1px solid var(--line);padding-left:30px}
  .qbody p{
    font-family:var(--serif);font-size:16.5px;line-height:1.85;color:#262626;margin-bottom:20px;
  }
  .qbody p:last-child{margin-bottom:0}
  .qbody ul:last-child{margin-bottom:0}
  .qbody p.dlg{padding-left:22px}
  .qbody p.blk{padding-left:22px;color:#3a3a3a;font-style:italic}
  .qbody ul{list-style:none;margin:0 0 20px 0}
  .qbody ul li{
    font-family:var(--serif);font-size:16px;line-height:1.75;color:#2e2e2e;
    padding:5px 0 5px 20px;position:relative;
  }
  .qbody ul li:before{
    content:'';position:absolute;left:2px;top:16px;width:5px;height:1px;background:#cfcfcf;
  }
  .qbody .attr{font-family:var(--sans);font-size:13px;color:var(--muted);margin:0}
  .tail{color:#c4c4c4}

  .full{display:none}
  .qwrap.expanded .preview{display:none}
  .qwrap.expanded .full{display:block;animation:fade .32s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .kids{margin-top:62px;border-top:1px solid var(--line-soft);padding-top:34px}
  .kids-lbl{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);margin-bottom:18px;font-weight:500;
  }
  .kid{
    display:flex;align-items:baseline;gap:14px;
    padding:14px 6px;border-bottom:1px solid var(--line-soft);
    cursor:pointer;transition:.16s;
  }
  .kid:hover{background:var(--hover)}
  .kid:hover .kid-t{color:var(--ink)}
  .kid .kid-m{color:#dcdcdc;font-size:10px;flex:0 0 10px;transition:.16s}
  .kid:hover .kid-m{color:var(--muted);transform:translateX(3px)}
  .kid-t{font-size:15.5px;color:var(--ink-soft);line-height:1.45;transition:color .16s}
  .kid-t .num{color:var(--faint);margin-right:9px}
  .kid.has .kid-t{font-weight:500}

  /* ---------- COVER ---------- */
  .cover-h{font-size:44px;font-weight:500;letter-spacing:-.025em;line-height:1.15;margin-bottom:16px}
  .cover-sub{font-size:14px;color:var(--muted);max-width:600px;line-height:1.75;margin-bottom:52px}
  .four{border-top:1px solid var(--line)}
  .four-item{
    display:flex;align-items:baseline;gap:24px;padding:26px 6px;
    border-bottom:1px solid var(--line);cursor:pointer;transition:.18s;
  }
  .four-item:hover{background:var(--hover);padding-left:14px}
  .four-n{font-size:12px;color:var(--faint);flex:0 0 20px;font-variant-numeric:tabular-nums}
  .four-t{font-size:19px;color:var(--ink-soft);font-weight:400;transition:color .16s}
  .four-item:hover .four-t{color:var(--ink)}

  /* ---------- FOOTER ---------- */
  footer.foot{border-top:1px solid var(--line);padding:30px 72px 44px 72px;background:#fff}
  .foot-in{max-width:780px;margin:0 auto;font-size:12.5px;line-height:1.8;color:var(--muted)}
  .foot-in a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid #dcdcdc;transition:.16s}
  .foot-in a:hover{border-bottom-color:var(--ink)}
  .foot-src{font-size:12px;margin-top:6px;color:var(--faint);word-break:break-all}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head"><div class="side-title" id="goCover">Приемы мистификации</div></div>
    <div class="tree" id="tree"></div>
  </aside>
  <main id="main">
    <div id="mainBody"><div class="wrap" id="view"></div></div>
    <footer class="foot">
      <div class="foot-in">
        Все приведенные тексты — дословные цитаты из статьи:<br>
        Репин&nbsp;Е.&nbsp;Н., Репина&nbsp;Н.&nbsp;А. Мистификаторы и пустозвоны (негодный язык общественных дисциплин), 2002.
        <div class="foot-src">
          Источник: <a href="https://terminomika.ru/data/library/authors/mistpust.html" target="_blank" rel="noopener">terminomika.ru/data/library/authors/mistpust.html</a>
        </div>
      </div>
    </footer>
  </main>
</div>

<script>
/* ============================ DATA ============================ */
const TREE = {
  id:'root', title:'Приемы мистификации', def:null,
  quotes:[
`высказывания обществоведов часто не соответствуют канонам грамотной речи. Очень часто. Настолько часто, что создают и закрепляют вредные правила. Правила, которые ложным высказываниям придают вид истинных. Правила, при которых истинные высказывания выглядят как ложные. Правила, которые бессмысленные высказывания или тривиальности выдают за осмысленные и гениальные.`,
`Просто те, кто пользуются этими приемами, добиваются политической власти над мистифицируемой публикой. А эта власть, в свою очередь, закрепляет приемы мистификации в речах, газетах, журналах, книгах, включая учебники и словари.`,
`Итак, четыре приема, которыми пользуются обществоведы, следующие:`,
{list:[`1. Употребление плеоназмов;`,`2. Полисемия важнейших слов;`,`3. Недержание основания при классификации;`,`4. Буквальное понимание тропов.`]}
  ],
  children:[
  /* ---------------- 1 ---------------- */
  { id:'p1', num:'1', title:'Употребление плеоназмов',
    def:`Плеоназмы (от греческого pleonasmos избыток) – это речевые излишества, избыточные слова. При удачном употреблении они несут эмоциональную нагрузку. При неудачном могут вводить в заблуждение.`,
    quotes:[],
    children:[
      { id:'p1_proto', title:'Протокольные плеоназмы', def:null, quotes:[
        {list:[
`Распивали спиртные напитки в лесном массиве (то есть: пили водку в лесу).`,
`Х, находясь в состоянии алкогольного опьянения… (вместо: пьяный Х).`,
`Х нанес побои У на почве быта.`,
`Иванову был нанесен удар по голове камнем из твердого грунта.`,
`Ударила сотрудника по совместной работе на месте совместной работы.`,
`В морг краевой больницы направляется труп гр. Х для принятия мер по существу.`,
`Направляется мужское тело гражданина Х.`,
`На кухне было обнаружено большое количество выблеванной пищевой продукции.`,
`При доставке пострадавшего в больницу от массы рвот несло достаточно чувствительным запахом алкоголя.`]},
`Когда унтер Пришибеев из чеховского рассказа объясняет в суде про утоплый труп мертвого человека, он пытается соответствовать своему званию.`
      ], children:[] },
      { id:'p1_taut', title:'Тавтология',
        def:`Одна из простейших форм плеоназма – тавтология (от греческого tauto – то же самое и logos – слово).`,
        quotes:[
`Тавтологии безобидны, когда за словами твердо закрепляются новые значения. Значения, явно отличающиеся от первоначальных. Тогда повторы исчезают, и тавтологии перестают быть тавтологиями. Например, белое белье – тавтология лишь в том случае, если под бельем понимается только белая ткань. Но сегодня слово "белье" никто так не понимает. Поэтому белое белье трудно назвать тавтологией. То же самое можно сказать о красной краске и черных чернилах.`
        ],
        children:[
          { id:'p1_taut_cel', title:'Целостная целостность целого', def:null, quotes:[
`Философы любят говорить о целостной системе. Но система (от греческого systema) – это целое. Однажды в книжке по психологии мне попалась даже холистическая система (греческое holos – целое). Такое словоупотребление вызывает подозрение о плохом понимании того, что есть система. И действительно, обществоведы часто системами называют достаточно рыхлые образования, например, экономическую систему, общественную систему, политическую систему, жалея это слово для человека, хотя человек гораздо более целостен (системен), чем любое общество. У человека есть воля, сознание. У общества, нации, страны нет этих качеств. Общество может распасться на части, и каждая часть может быть вполне жизнеспособной. Человек может жить лишь как целое, как система. Целостность (системность) – это единственный способ человеческого бытия, единственный способ существования живого тела и души.`
          ], children:[] },
          { id:'p1_taut_sob', title:'Обособленность собственной собственности', def:null, quotes:[
`Одна из самых опасных тавтологий – частная собственность, при использовании данного выражения для обозначения порядка, отделяющего "мое" от "чужого". Этот порядок Маркс, а вслед за ним большевики во главе с Лениным собирались уничтожить. Оба слова в этой тавтологии указывают на отделение, обособление, размежевание, разграничение, приватность. Обозначать порядок, который осуждают коммунисты, частной собственностью столь же нехорошо, как называть его, например, частной приватностью, приватной обособленностью либо отдельной собственностью.`,
`Мы уже не раз убеждались, что серьезное отношение к тавтологиям портит слова, делает их неясными. Когда российские марксисты призывали к уничтожению частной собственности, далеко не все поняли, что и каким образом будет уничтожаться. Одна из причин непонимания – тавтология в названии института, подлежащего уничтожению. Люди полагали, что уничтожению подлежит только частная собственность, а не собственность вообще. Ведь если есть частная собственность, возникает ощущение, что есть какая-то другая, не частная, собственность. Но это ложное ощущение, вызванное тавтологией. Тавтология в названии очень важного института усыпила бдительность, и поэтому россияне не достаточно энергично боролись с марксистами, которые уничтожали собственность – границы, защищающие одних от непрошеного вмешательства других.`
          ], children:[] }
        ]
      },
      { id:'p1_kvad', title:'Квадратные четырехугольники в геометрической математике',
        def:`Плеоназмы – это излишества. Они не всегда имеют форму тавтологий.`,
        quotes:[
`Например, плеоназмы денежные средства, заемные обязательства. Деньги – это всегда средства, а заем всегда порождает обязательства, поэтому говорить о денежных средствах и заемных обязательствах так же нехорошо, как говорить о яблочных фруктах, кастрюльной посуде, брючной одежде, треугольных многоугольниках.`,
`Нехорошо технику называть технологией. Среду, в которой мы живем, – экологией. Рост производства – экономическим ростом. Центр – эпицентром, гениальность – конгениальностью.`
        ], children:[] }
    ]
  },
  /* ---------------- 2 ---------------- */
  { id:'p2', num:'2', title:'Полисемия важнейших слов',
    def:`Слова многозначны. Это их свойство называется полисемией (от греческого poly – много, и sema – знак). Одно значение слова может существенно отличаться от другого. Особенно в омонимах. Омонимы (от греческого homos – одинаковый и onyma – имя) – это слова, имеющие одно имя, но разные смыслы.`,
    quotes:[
`В науке принято за очень важными, ключевыми словами закреплять строго определенный, одинаково понимаемый смысл. Тогда эти слова превращаются в термины. У обществоведов смысл важнейших слов размыт. Причем далеко не всегда можно понять, каким смыслом в данный момент наполнено то или иное слово. Смысл некоторых слов размыт настолько, что ими уже нельзя объясняться. С их помощью можно создавать лишь видимость объяснения.`
    ],
    children:[
      { id:'p2_sob', title:'Собственность: имущество или порядок?', def:null, quotes:[
`Собственность – это, с одной стороны, порядок, институт, который не нравится коммунистам. С другой стороны, этим словом часто называют сами вещи, само имущество.`,
`Когда собственность – это вещь, тогда тавтологию частная собственность еще можно оправдать: она несет в себе информационную нагрузку, отличая частные вещи от общественных (публичных). Но многие, например марксисты, понимают собственность иначе, чем вещь, средство, ресурс. Для них это порядок, закрепляющий эти вещи за отдельными людьми, институт приватности, частности, размежевания, разграничения. Ведь, объявляя об уничтожении частной собственности, они объявляли об уничтожении этого порядка, а не вещей.`,
`Когда собственность – это институт, тогда тавтология частная собственность затрудняет понимание. Ведь оба слова в этой тавтологии указывают на приватность, а двойное указание на приватность должно вызывать беспокойство по поводу этой приватности.`
      ], children:[] },
      { id:'p2_gos', title:'Государство: страна или организация?', def:null, quotes:[
`Слово государство тоже опасно двусмысленно. Им обозначают страну с населяющими ее людьми. Им обозначают организацию. Причем уникальную организацию. В отличие от других организаций она может обязать людей платить ей за свои услуги, даже если людям не нравятся эти услуги или они считают эти услуги слишком дорогими. Эту обязательную плату государству-организации принято называть налогами.`,
`Можно, конечно, представить себе ситуацию, когда все жители страны являются членами организации под названием государство. В Советском Союзе и других коммунистических странах почти все взрослые люди состояли в этой организации, а, состарившись, получали пенсию от этой организации. Но можно представить себе и иную ситуацию: в организации под названием государство состоит лишь часть, иногда очень малая часть, населения страны. Людовик XIV, говорят, полагал, что государство – он один. Понятно, что в случае, когда государство лишь малая часть населения страны, полезно отличать государство-страну от государства-организации или государства-человека.`,
`В российской Конституции говорится, что Россия – государство (ст. 1), а Президент – глава государства (ст. 80). Но вот вопрос: Россия это страна или организация? Президент – это глава страны или организации? Напрасно искать ответы на эти вопросы в Конституции или других российских законах. А ведь от ответа на эти вопросы зависит очень многое.`,
`Если Россия берет на себя какие-то обязательства, то кому отвечать за их выполнение: государству-организации или государству-стране? Если государству-организации, то, похоже, что не мне. Если государству-стране, то и с меня могут спросить, даже если я был против тех обязательств, которые от моего имени брала на себя Россия.`,
`А кто такой глава государства? Если он глава организации, то пусть себе командует своей организацией, а мне он не начальник. Если он глава страны, то я как житель этой страны, должен ему подчиняться.`
      ], children:[] },
      { id:'p2_stoim', title:'Стоимость: полезность или затратность?', def:null, quotes:[
`Стоимость – еще одно важное слово с двумя разными смыслами. С одной стороны, это затраты, издержки, а с другой – ценность, важность, значимость. Когда речь идет о высокой стоимости вещи, не сразу поймешь, что имеется в виду. То ли она требует высоких затрат, то ли она очень важна и нужна. Согласитесь, что вещь может быть очень значимой, нужной, но получена малыми силами. Возможна и обратная ситуация: затраты на приобретение вещи огромны, а ее значимость мала.`,
`При такой двусмысленности, что понимать под добавленной стоимостью? А ведь это важно – с нее налог предусмотрен. За что берут налог? То ли за добавленные налогоплательщиком затраты, то ли за добавленную им значимость вещи. Можно малыми затратами добавить много пользы, а можно бесполезно растратить кучу средств. Как будем считать добавленную стоимость: по добавленным затратам или добавленной пользе? Результат может получиться очень разный.`,
`А как понимать положение трудовой теории стоимости: стоимость товара определяется количеством труда, затраченного на изготовление товара. Если стоимость – это затраты, то это положение звучит верно, но тавтологично: затраты определяются затратами. Если стоимость – полезность, важность, значимость, желанность, то это положение выглядит очень смелым. Настолько смелым, что легко привести примеры, когда оно не верно. Каждый может привести массу примеров бесполезной растраты труда или высоких результатов малыми затратами труда. Двусмысленность слова стоимость позволяет некорректное высказывание о трудовом характере стоимости выдавать за научное открытие огромной важности.`
      ], children:[] },
      { id:'p2_obsh', title:'Общественный: общающийся или публичный?', def:null, quotes:[
`Общественный означает относящийся к общению, взаимодействию людей. Взаимодействие бывает приватным, касающимся только взаимодействующих людей, а бывает публичным, касающимся всех. Как понимать общественные проблемы, общественные интересы? То ли это публичные (всеобщие) проблемы и интересы, то ли проблемы общения и частные интересы общающихся людей.`,
`Ленин, используя двусмысленность слова общество, утверждал, что "жить в обществе и быть свободным от общества нельзя" (ПСС, т. 12 с. 104). Если под обществом понимать общающихся людей, то ленинское утверждение верно, как верна тавтология: общаясь нельзя быть свободным от общения. С этим не поспоришь. Но, соглашаясь с этой тавтологией, люди невольно соглашались и с другой трактовкой ленинской формулы: общаясь нельзя быть свободным от публичности. А это, вообще говоря, неверно.`
      ], children:[] },
      { id:'p2_soc', title:'Социальный: общественный или дружеский?', def:null, quotes:[
`Фридрих Август фон Хайек не любил слова общество и общественный. Но еще больше он не любил слово социальный. По мнению Хайека, это слово стало, пожалуй, самым бестолковым во всей нашей моральной и политической лексике. Тем не менее, наше государство (то ли страна, то ли организация) провозглашено социальным (статья 7 Конституции России). С одной стороны социальный – это, кажется, общественный. Но в каком смысле? Публичное государство? Или общающееся? Если публичное, то это близко к народному. Но наше государство уже объявлено демократическим и республиканским, то есть дважды народным, в статье 1 Конституции. Трижды народное государство не должно вдохновлять тех, кто хочет демократии в первоначальном смысле этого слова. Если социальное государство – это общающееся государство, то чтобы это значило?`,
`Слово социальный имеет, по крайней мере, еще один смысл. Это дружеский (от латинского socia – подруга и socialis – товарищеский, приятельский). В этом смысле социальное часто понимают как нечто противоположное экономическому. Экономическому – в смысле деловому, корыстному, нацеленному на прибыль, на выгоду, на рост производства. Нужно заботится о пожилых и инвалидах и это социально, хотя может быть и не экономично, то есть не прибыльно.`
      ], children:[] },
      { id:'p2_dial', title:'Диалектика: искусство быть понятым или непонятым?', def:null, quotes:[
`В советское время, пожалуй, самыми бестолковыми словами, которые употребляли обществоведы, были диалектика и диалектический. Когда-то диалектикой называли искусство вести беседу. Потом этим словом стали называть логику. Лишь Гегель придал этому слову совершенно необычный смысл. Гегелевская диалектика – особый метод познания, с помощью которого легко решать сложнейшие проблемы непосильные для "бесплодной формальной логики".`,
`Гегель, по мнению А. Шопенгауэра, который лично его знал, был глупый, скучный, противный, безграмотный шарлатан и наглый мистификатор. Тот же Шопенгауэр сказал, что Гегель оказал опустошающее, точнее, оглупляющее влияние не только на философию, но и на все формы немецкой литературы.`,
`Диалектику употреблял даже унтер Пришибеев когда, например, объяснял судье, что "по всем статьям закона выходит причина аттестовать всякое обстоятельство во взаимности". Это в духе Гегеля, который писал, что "всякая конкретная вещь состоит в различных отношениях ко всему остальному". Наиболее полное воплощение диалектика Гегеля-Пришибеева нашла в диалектическом материализме, который "признает всеобщую взаимосвязь предметов и явлений, движение и развитие мира как результат его внутренних противоречий" (Советский энциклопедический словарь).`,
`Советские обществоведы очень любили диалектику. И не только как метод познания. Они любили сами слова диалектика, диалектический. Я сам как-то участвовал в конференции, которая называлась: "Диалектика мировоззрения и социальной практики в условиях перестройки". Эти слова подчеркивают ученость и приобщение к особому методу познания. Их употребление позволяет прикрыть тривиальность высказывания или обессмыслить его. А тривиальные или бессмысленные высказывания не оспоришь, поэтому не придерутся оппоненты.`,
`С помощь диалектики можно доказать и опровергнуть все, что угодно. Это свойство диалектики отразилось в анекдоте советских времен.`,
`Студент объясняет любопытной бабуле диалектику, пять раз задавая ей один и тот же вопрос: "Кому из двух приятелей идти в баню – чистому или грязному?". Бабуля в первый раз отвечает, что грязному. "Неправильно, – говорит студент, – ведь грязнуля привык к своей грязи, ему и так хорошо. Другое дело чистюля". Бабуля поправляется и отправляет в баню чистого. "Но ведь чистому мыть нечего, – говорит студент, – зачем ему в баню?". В третий раз бабуля решает обоих не отправлять в баню: грязному и так хорошо, а чистому мыть нечего. "Ошиблась, – говорит студент, – чистюле может быть неприятна грязь приятеля". В четвертый раз бабуля отправляет в баню обоих, чтобы грязный не испачкал чистого. "Опять ошибка, – говорит студент, – чистому мыть нечего, а грязнуле мытье наказание". Когда студент в пятый раз задает свой вопрос, бабуля долго молчит, а потом говорит: "Ерунда какая-то". "Это бабуля и есть диалектика!" – подытоживает студент.`,
`Заметьте, что студент незаметно для бабули подменяет смыслы. Грязный у него из человека, которому следует помыться, превращается, когда надо, в грязнулю, то есть в человека, который не любит мыться. Чистый тоже из только что вымытого человека превращается в любителя мыться. И наоборот.`,
`Этот анекдот вырос не на пустом месте. Сам Маркс употреблял диалектику в анекдотическом смысле: "Возможно, я оскандалюсь (в своих предсказаниях – Е. Р.). Но тогда можно будет как-нибудь выпутаться при помощи небольшой диалектики. Разумеется, свои предсказания я изложил таким образом, чтобы быть правым и в противоположном случае"`,
`В советское время университетский преподаватель рассказывал нам о развитии колхозов и о том, что колхозы, не будучи государственными, меньше отвечают идеалам социализма, чем совхозы. Я спросил: зачем, если нам дороги идеалы социализма, нужно развивать колхозы? Не лучше ли сначала преобразовать их в совхозы, а потом и развивать? Преподаватель ответил, что есть такой закон диалектики: отмирание через развитие.`,
`Аналогично применяет диалектику героиня романа Юза Алешковского, выступая с лекцией "Коренные противоречия в сельском хозяйстве США":`,
{blk:[
`Фермеры служат орудием американского империализма в деле обкармливания рабочего класса и интеллигенции продуктами питания с целью отвлечения их от мировой классовой борьбы. Кроме того, США пользуются временным недоеданием социалистического лагеря и развивающихся стран, которые тратят огромные деньги на защиту священных границ от наступления миллионеров из Пентагона на завоевания революции.`,
`Ихняя цель – наполнить наши желудки хлебом и мясом, чтобы на сытое брюхо забыли мы призыв товарища Ленина строить коммунизм на планете и за ее пределами.`,
`У нас есть секретные сведения, что Рейген в плане крестового похода на коммунизм дал указание платить фермерам огромные деньги за уменьшение посевных площадей. Это есть главное противоречие между колхозами и единичными хозяйствами. Мы всячески вкладываем капиталы в разные целины, чтобы прокормить строителей коммунизма, а Рейген, наоборот, призывает фермеров ни черта не сеять хлеб, чтобы задушить коммунизм голодом…`]},
`Встаю с места и возражаю:`,
{dlg:[`– Как же так? С одной стороны, США хочет набить нам брюхо хлебом и мясом, которое мы у них покупаем, а с другой – Рейген пытается задушить нас голодом? Концы с концами не сходятся, товарищ Завзялова…`,
`– Диалектику надо понимать. По диалектике все концы с концами сходятся. Вы вот возмущаетесь очередями в городе за продуктами. А партия учит, что очереди в стране существуют для того, чтобы в будущем их не было. Милицию и КГБ мы укрепляем по указанию товарища Андропова с целью отмирания карательных органов при коммунизме, когда уже совсем некого будет карать.`]},
`Сегодня, по сравнению с советским временем, диалектика в меньшем почете. Сегодня на первое место по бестолковости выходят слова общество, общественный, социальный, экономика, экономический.`
      ], children:[] },
      { id:'p2_ekon', title:'Диалектическая экономика или экономическая диалектика',
        def:`Слово экономика имеет, по крайней мере, четыре разных смысла.`,
        quotes:[
`Во-первых, экономика – это управление хозяйством, домострой. По крайней мере, так понимал это слово его изобретатель древний грек Ксенофонт. Его экономика – это домоводство, умение хозяйствовать. Сегодня экономикой принято называть одну из общественных дисциплин. Обществоведы гордо называют ее наукой. Правда современная экономика-наука не имеет ничего общего с экономикой Ксенофонта.`,
`Во-вторых, экономикой часто называют не только искусство хозяйствовать, но и само хозяйство. Причем, обычно не хозяйство отдельного человека, а хозяйство страны (народное хозяйство или национальная экономика), региона, города, на худой конец, крупного предприятия. В последнее время стали говорить о мировом хозяйстве (мировой экономике). Когда говорят о подъеме экономики, экономическом развитии, росте и спаде, об экономическом кризисе, то речь идет скорее о хозяйственных успехах или неудачах, чем о состоянии учения, заложенного Ксенофонтом.`,
`Мы уже знаем, что называть дом, хозяйство домостроем, домоводством или экономикой значит с серьезным видом создавать плеоназмы со всеми вытекающими последствиями.`,
`В-третьих, экономикой называют некоторые отношения между людьми. Эти отношения называют производственными, экономическими, иногда хозяйственными. Но отличить экономические отношения от неэкономических крайне непросто.`,
`В-четвертых, экономикой называют науку о человеческих отношениях. О производственных или экономических отношениях.`,
`После всего этого попробуй догадаться, что означает экономический суверенитет или экономическая безопасность страны. А именно на защиту данного суверенитета и данной безопасности нацелены наши таможенники. Так их ориентирует Таможенный кодекс России.`
        ], children:[] }
    ]
  },

  { id:'p3', num:'3', title:'Недержание основания при классификации',
    def:`Классифицировать можно по уму, красоте, весу, размеру, запаху, цвету… По любому основанию или признаку.`,
    quotes:[
`Лев строит зверей:`,
{dlg:[`– Умные по правую сторону, красивые – по левую. Мартышка, почему не строишься?`,
`– Мне что, разорваться что ли?`]},
{attr:`Анекдот`},
`Население от этого, конечно, выиграет, но все остальные проиграют.`,
{attr:`И. Козлов. "Коммерсантъ ДЕНЬГИ"`}
    ],
    children:[
      { id:'p3_kit', title:'"Китайская" классификация', def:null, quotes:[
`Важно удерживать основание и не менять его в процессе классификации. А то получиться как в анекдоте: от забора и до обеда. Или как с классификацией животных, которая приписывается одной китайской энциклопедии. В ней животные подразделяются на:`,
{list:[
`а) принадлежащих императору;`,
`б) бальзамированные;`,
`в) прирученных;`,
`г) молочных поросят;`,
`д) сирен;`,
`е) сказочных;`,
`ж) бродячих собак;`,
`з) включенных в настоящую классификацию;`,
`и) буйствующих, как в безумии;`,
`к) неисчислимых;`,
`л) нарисованных очень тонкой кисточкой из верблюжьей шерсти;`,
`м) и прочих;`,
`н) только что разбивших кувшин;`,
`о) издалека кажущихся мухами.`]}
      ], children:[] },
      { id:'p3_proto', title:'Протокольная классификация',
        def:`А теперь фразы из полицейских протоколов без комментариев:`,
        quotes:[
{list:[
`Такое состояние может быть не только у здоровых людей, занимающихся спортом, но при других заболеваниях.`,
`Жалобы на интенсивную головную боль в шейном отделе позвоночника.`,
`Гражданин Х поступил в стационар в бессознательном состоянии, с жалобами на боль в бедре.`,
`С какой скоростью двигался пешеход, если в момент столкновения с автомобилем трость отлетела на 5 метров, челюсть на 2 метра, а одна нога была короче другой на 10 см?`,
`Следы наложения подошвы на грудной и брюшной клетках.`,
`Среди похищенного – сервант мебельный, ношенный.`,
`На теле потерпевшего в области груди имеются гематомы размером в 5-копеечную монету, 15-копеечную монету и другие повреждения – всего на сумму 1р. 25к.`,
`Одна нога трупа была подвернута, другая откинута в сторону, а левая – вытянута вдоль тела.`,
`Том 2-ой настоящего дела является продолжением тома 1-го, нумерация листов соответствует нумерации тома 1-го. В связи с этим том 2-ой считать томом 3-им. В распоряжение экспертов предоставить уголовное дело в 3-х томах.`]}
        ], children:[] },
      { id:'p3_pods', title:'Бездуховная экономика и несоциальная политика', def:null, quotes:[
`В учебнике по философии прочитал, что общество – это система, состоящая и четырех подсистем:`,
{list:[`экономической,`,`политической,`,`социальной и`,`духовной.`]},
`"Китайская" классификация животных вызывает улыбку, потому что в ней речь идет о понятных вещах. "Китайская" классификация общественных подсистем у многих вызывает почтение, потому что речь идет о неясных вещах: обществе, экономике, системе, социальности, духовности, политике. Можно как карты тасовать эти неясные слова и исходя из обстановки интерпретировать полученную комбинацию, выдавая свою интерпретацию за научные выводы. Подобная классификация добивает последний смысл, содержащийся в этих словах, превращая их в слова-пустышки, которыми можно безответственно сотрясать воздух и портить бумагу.`
      ], children:[] },
      { id:'p3_haos', title:'Хаос торговли и анархия купцов', def:null, quotes:[
`Наряду с классификацией по размеру экономисты делят экономику (на этот раз не науку, а хозяйство) на плановую и рыночную. Такая классификация создает ложное ощущение, что торгующие люди не составляют планов, что только запрет торговли или ее государственная регламентация обеспечивает плановость, что свободная торговля прямо противоположна плановости, что это хаос, анархия, беспорядок.`
      ], children:[] },
      { id:'p3_kap', title:'Капитальный труд земли', def:null, quotes:[

/* ============================ INDEX ============================ */
const INDEX = {};
(function build(n, parent, path){
  const p = path.concat([n]);
  INDEX[n.id] = {node:n, parent:parent, path:p, level:p.length - 1};
  (n.children||[]).forEach(c=>build(c, n, p));
})(TREE, null, []);

const opened = new Set();
let state = {view:'cover', id:null};
const viewEl = document.getElementById('view');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const label = n => (n.num ? `<span class="num">${n.num}.</span>` : '') + esc(n.title);

/* ============================ SENTENCES ============================ */
const ABBR = new Set(['гр','ст','т','с','р','п','г','к','см','пр','ул','гг','Е','Р']);
function splitSentences(text){
  const out = []; let cur = '';
  for(let i=0;i<text.length;i++){
    cur += text[i];
    const ch = text[i];
    if('.!?…'.indexOf(ch) === -1) continue;
    const m = text.slice(i+1).match(/^\s+(\S)/);
    if(!m) continue;
    if(!/[А-ЯЁA-Z"«(]/.test(m[1])) continue;
    const bw = cur.slice(0,-1).match(/([A-Za-zА-Яа-яЁё.]+)$/);
    const w = bw ? bw[1].replace(/\./g,'') : '';
    if(ABBR.has(w)) continue;
    out.push(cur.trim());
    cur = '';
    let j = i+1;
    while(j < text.length && /\s/.test(text[j])) j++;
    i = j-1;
  }
  if(cur.trim()) out.push(cur.trim());
  return out;
}
function quoteWeight(arr){
  let n = 0;
  arr.forEach(q=>{
    if(typeof q === 'string') n += splitSentences(q).length;
    else if(q.dlg) n += q.dlg.length;
    else if(q.blk) q.blk.forEach(b=> n += splitSentences(b).length);
    else if(q.list) n += q.list.length;
  });
  return n;
}

/* ============================ QUOTES RENDER ============================ */
function renderQuotes(arr){
  if(!arr || !arr.length) return '';
  let h = '';
  arr.forEach(q=>{
    if(typeof q === 'string') h += `<p>${esc(q)}</p>`;
    else if(q.list) h += `<ul>${q.list.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
    else if(q.dlg) q.dlg.forEach(d=> h += `<p class="dlg">${esc(d)}</p>`);
    else if(q.blk) q.blk.forEach(d=> h += `<p class="blk">${esc(d)}</p>`);
    else if(q.attr) h += `<p class="attr">${esc(q.attr)}</p>`;
  });
  return h;
}
function renderPreview(arr){
  const first = arr.find(q => typeof q === 'string');
  if(!first) return renderQuotes([arr[0]]);
  const s = splitSentences(first)[0] || first;
  return `<p>${esc(s)} <span class="tail">…</span></p>`;
}

/* ============================ TREE ============================ */
function buildTree(n){
  const has = n.children && n.children.length;
  const wrap = document.createElement('div');
  wrap.className = 't-item';
  const row = document.createElement('div');
  row.className = 't-row';
  const tw = document.createElement('button');
  tw.className = 'twist' + (has ? '' : ' leaf');
  tw.textContent = '▶';
  const lb = document.createElement('button');
  lb.className = 't-label';
  lb.dataset.id = n.id;
  lb.innerHTML = label(n);
  row.appendChild(tw); row.appendChild(lb); wrap.appendChild(row);
  if(has){
    const kids = document.createElement('div');
    kids.className = 't-kids collapsed';
    n.children.forEach(c=> kids.appendChild(buildTree(c)));
    wrap.appendChild(kids);
    tw.addEventListener('click', e=>{
      e.stopPropagation();
      kids.classList.toggle('collapsed');
      tw.classList.toggle('open');
    });
  }
  lb.addEventListener('click', ()=> go('node', n.id));
  return wrap;
}
const treeRoot = document.getElementById('tree');
treeRoot.appendChild(buildTree(TREE));

function syncTree(){
  document.querySelectorAll('.t-label').forEach(el=> el.classList.remove('on'));
  if(state.view !== 'node') return;
  const rec = INDEX[state.id]; if(!rec) return;
  rec.path.forEach(n=>{
    const lb = treeRoot.querySelector(`.t-label[data-id="${n.id}"]`);
    if(!lb) return;
    let p = lb.closest('.t-item').parentElement;
    while(p && p !== treeRoot){
      if(p.classList.contains('t-kids')){
        p.classList.remove('collapsed');
        const t = p.parentElement.querySelector(':scope > .t-row > .twist');
        if(t) t.classList.add('open');
      }
      p = p.parentElement;
    }
  });
  const active = treeRoot.querySelector(`.t-label[data-id="${state.id}"]`);
  if(active){ active.classList.add('on'); active.scrollIntoView({block:'nearest'}); }
}

    const d = document.createElement('div');
    d.className = 'four-item';
    d.innerHTML = `<div class="four-n">${c.num}</div><div class="four-t">${esc(c.title)}</div>`;
    d.addEventListener('click', ()=> go('node', c.id));
    four.appendChild(d);
  });
}

function renderNode(id){
  const rec = INDEX[id];
  if(!rec){ state = {view:'cover'}; renderCover(); return; }
  const n = rec.node;
  const hasQ = n.quotes && n.quotes.length;
  const isShort = hasQ && quoteWeight(n.quotes) <= 3;
  const expandable = hasQ && !isShort;
  const isOpen = expandable && opened.has(id);

  const crumbs = rec.path.slice(0,-1).map(a=>
    `<button data-go="${a.id}">${esc(a.title)}</button><span class="sep">/</span>`).join('');

  let qHtml = '';
  if(hasQ){
    if(isShort){
      qHtml = `<div class="qwrap"><div class="qbody">${renderQuotes(n.quotes)}</div></div>`;
    }else{
      qHtml = `<div class="qwrap ${isOpen?'expanded':''}" id="qwrap">
        <div class="qbody preview">${renderPreview(n.quotes)}</div>
        <div class="qbody full">${renderQuotes(n.quotes)}</div>
      </div>`;
    }
  }

  let kidsHtml = '';
  if(n.children && n.children.length){
    kidsHtml = `<div class="kids"><div class="kids-lbl">${n.children.length}</div>` +
      n.children.map(c=>{
        const sub = c.children && c.children.length;
        return `<div class="kid ${sub?'has':''}" data-go="${c.id}">
          <span class="kid-m">▶</span><span class="kid-t">${label(c)}</span></div>`;
      }).join('') + `</div>`;
  }

  viewEl.innerHTML = `
    <div class="crumbs">${crumbs}<span style="color:#cfcfcf">${esc(n.title)}</span></div>
    <h1 class="term ${expandable?'expandable':''} ${isOpen?'opened':''}" id="termHead">${label(n)}</h1>
    ${n.def ? `<div class="def">${esc(n.def)}</div>` : ''}
    ${qHtml}
    ${kidsHtml}`;

  viewEl.querySelectorAll('[data-go]').forEach(el=>
    el.addEventListener('click', ()=> go('node', el.dataset.go)));

  if(expandable){
    const head = document.getElementById('termHead');
    const qw = document.getElementById('qwrap');
    head.addEventListener('click', ()=>{
      const o = qw.classList.toggle('expanded');
      head.classList.toggle('opened', o);
      if(o) opened.add(id); else opened.delete(id);
    });
  }
}

/* ============================ ROUTER ============================ */
function go(view, id){
  state = {view, id: id || null};
  location.hash = (view === 'node' && id) ? '#/' + id : '#/';
  paint();
}
function paint(){
  if(state.view === 'cover') renderCover();
  else renderNode(state.id);
  syncTree();
  window.scrollTo({top:0, behavior:'auto'});
}
function fromHash(){
  const h = location.hash.replace(/^#\//,'');
  if(h && INDEX[h]) return {view:'node', id:h};
  return {view:'cover'};
}
window.addEventListener('hashchange', ()=>{ state = fromHash(); paint(); });
document.getElementById('goCover').addEventListener('click', ()=> go('cover'));
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') go('cover'); });

state = fromHash();
paint();
</script>
</body>
</html>
